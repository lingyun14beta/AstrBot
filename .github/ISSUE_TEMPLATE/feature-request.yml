name: "🎉 Feature Request / 功能建议"
description: Submit a new feature idea or suggestion. / 向我们提交一个新的功能想法或建议。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description / 功能描述
      description: What would you like AstrBot to do? / 您希望 AstrBot 增加什么功能？
      placeholder: Describe in detail the feature you would like to add. / 详细描述您希望添加的功能。
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / 使用场景
      description: When and why would you need it? / 您在什么场景下需要它？
      placeholder: Describe the use case for your suggested feature. / 描述您建议的功能的使用场景。
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist / 检查清单
      options:
        - label: I have searched the [Issue list](https://github.com/AstrBotDevs/AstrBot/issues) for related features and confirmed this feature idea has never been proposed.<br>我已在 [Issue 列表](https://github.com/AstrBotDevs/AstrBot/issues)中搜索过相关功能，确认该功能想法从未被提出过。
          required: true
        - label: The feature I am suggesting is related to AstrBot itself, not to a specific plugin.<br>我建议的功能与 AstrBot 本体相关，而非在建议某一插件的功能。
          required: true
        - label: I have read and agree to the project's [Code of Conduct](https://github.com/AstrBotDevs/AstrBot/blob/master/CODE_OF_CONDUCT.md).<br>我已阅读并同意本项目的[贡献者行为准则](https://github.com/AstrBotDevs/AstrBot/blob/master/CODE_OF_CONDUCT.md)。
          required: true
        - label: (Optional) I am willing to submit a PR to help implement this feature.<br>(可选)我愿意提交 PR 以帮助实现该功能。
          required: false

  - type: markdown
    attributes:
      value: "Thank you for sharing your valuable ideas with us! / 感谢您向我们提交您宝贵的想法！"
