name: "🐛 Bug Report / 报告 Bug"
description: Submit a bug report to help us improve. / 提交问题报告以帮助我们改进。
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description / 问题描述
      description: What happened? / 发生了什么？
      placeholder: |
        A clear and specific description of what happened, or what problem you encountered.
        清晰且具体地描述发生了什么，或遇到了什么问题。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps / 如何复现？
      description: Steps to reproduce the issue. / 复现该问题的步骤。
      placeholder: |
        For example: / 例如:
        1. Open ... / 打开 ...
        2. Click ... / 点击 ...
        3. Issue reproduced / 问题复现
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AstrBot Version / AstrBot 版本
      description: The AstrBot version where the issue occurred. The built-in `/help` command prints it. Please do not use meaningless values like `latest`. / 发生问题的 AstrBot 版本，可通过内置 `/help` 指令查看。请不要使用诸如 `latest` 之类的无意义值。
      placeholder: For example, v4.29.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / 操作系统
      description: The operating system where AstrBot is running. / AstrBot 运行所在的操作系统。
      options:
        - "Windows"
        - "MacOS"
        - "Linux"
        - "Other"
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      # Deployment methods may expand in the future. To avoid frequent form modifications,
      # we use an input field here so users can fill it in themselves.
      label: Deployment Method / 部署方式
      description: How AstrBot is deployed. / AstrBot 的部署方式。
      placeholder: For example, Docker, Windows Desktop
    validations:
      required: true

  - type: input
    id: platform-adapter
    attributes:
      # Same as above
      label: Message Platform Adapter / 使用的消息平台适配器
      description: The message platform adapter being used when the issue occurred. / 发生问题时使用的消息平台适配器。
      placeholder: For example, QQ Official Bot (WebSocket), Onebot v11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Log / 错误日志
      description: |
        Debug-level logs related to the issue. Issues without valid logs will be closed, thank you for your understanding.<br>
        To get them, set `Console Log Level` to `DEBUG` under **Settings → General → Logs**, reproduce the issue, then paste the logs here.<br>
        **Remove sensitive data before posting**: API keys, tokens, bot credentials, chat content, user IDs, IP addresses.<br>
        / 与问题相关的 Debug 级别日志。没有有效日志的 Issue 将被关闭，谢谢理解。<br>
        获取方式：在「设置 → 常规 → 日志」中把「控制台日志级别」改为 `DEBUG`，复现问题后把日志粘贴到这里。<br>
        **发布前请移除敏感信息**：API Key、令牌、机器人凭据、聊天内容、用户 ID、IP 地址。
      render: text
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Supplementary Information / 辅助信息
      description: |
        Other supplementary information related to the issue, such as reproduction videos or complete log files. Please upload images in the description.<br>
        If the logs are too long to fit in the previous field, paste only the key logs there and upload the complete log file here. Turn on `Enable File Logging` under **Settings → General → Logs** to write logs to a file (default `logs/astrbot.log` under the `data` directory), and remove sensitive data before uploading.<br>
        / 与问题相关的其他辅助信息，例如复现视频、完整日志文件。图片请在问题描述中上传。<br>
        如果日志过长以至不适合填到上一栏，可以只贴关键日志，把完整的日志文件上传到这里。在「设置 → 常规 → 日志」中开启「启用文件日志」即可把日志写入文件（默认路径为 `data` 目录下的 `logs/astrbot.log`），上传前请移除敏感信息。
    validations:
      accept: ".txt,.log,.mp4,.mov,.webm,.zip,.gz"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist / 检查清单
      options:
        - label: I have searched the [Issue list](https://github.com/AstrBotDevs/AstrBot/issues) for related issues and could not resolve the problem, or this issue has never been reported before.<br>我已在 [Issue 列表](https://github.com/AstrBotDevs/AstrBot/issues)中搜索过相关问题仍无法解决，或该问题从未被报告过。
          required: true
        - label: I have tried disabling all plugins to rule out issues caused by plugins.<br>我已尝试过禁用所有插件，排除了可能是因插件导致的问题。
          required: true
        - label: The issue I am reporting is related to AstrBot itself, not to a specific plugin.<br>我报告的问题与 AstrBot 本体相关，而非在报告某一插件的问题。
          required: true
        - label: I have read and agree to the project's [Code of Conduct](https://github.com/AstrBotDevs/AstrBot/blob/master/CODE_OF_CONDUCT.md).<br>我已阅读并同意本项目的[贡献者行为准则](https://github.com/AstrBotDevs/AstrBot/blob/master/CODE_OF_CONDUCT.md)。
          required: true
        - label: (Optional) I am willing to submit a PR to help fix this issue.<br>(可选)我愿意提交 PR 以帮助修复该问题。
          required: false

  - type: markdown
    attributes:
      value: "Finally, thank you for taking the time to report this issue! / 最后，感谢您抽出时间报告问题！"
